<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Karakeep media performance fixture</title>
    <style>
      body {
        margin: 0;
        background: #eee;
        font-family: system-ui;
      }
      header {
        padding: 20px;
      }
      .grid {
        padding: 20px;
      }
      * {
        box-sizing: border-box;
      }
      @media (max-width: 640px) {
        .grid {
          height: auto !important;
          overflow-y: visible !important;
        }
      }
      .grid a {
        display: block;
        position: relative;
        aspect-ratio: 3/2;
        overflow: hidden;
      }
      .grid a > div {
        height: 100%;
        position: relative;
      }
      .grid img,
      .grid video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .grid video {
        position: absolute;
        inset: 0;
      }
      .opacity-0 {
        opacity: 0;
      }
      .viewer {
        position: fixed;
        inset: 40px;
        background: white;
        z-index: 10;
        padding: 20px;
        overflow: auto;
      }
      .viewer img,
      .viewer video {
        width: auto;
        height: auto;
        max-height: 300px;
        max-width: 500px;
      }
      .viewer button {
        margin: 5px;
      }
      .viewer svg {
        width: 20px;
        height: 20px;
      }
      .viewer section > div:first-child {
        position: relative;
      }
      .viewer img[aria-hidden] {
        display: none;
      }
      .viewer button img {
        max-width: 70px;
        max-height: 60px;
      }
      button {
        padding: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
