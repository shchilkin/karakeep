# Integration template; no host ports and no Docker socket.
# Existing individual GPU service containers must be stopped during cutover.
services:
  gpu-lifecycle:
    image: ${GPU_RUNTIME_IMAGE:?set the verified immutable runtime image}
    platform: linux/amd64
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 12g
    memswap_limit: 12g
    pids_limit: 256
    devices: [nvidia.com/gpu=0]
    stop_grace_period: 20s
    environment:
      GPU_LOCK_FILE: /gpu-lease/gpu.lock
      HF_HOME: /tmp/hf
      CUDA_CACHE_PATH: /tmp/cuda-cache
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    volumes:
      - type: bind
        source: ${SHIELD_MODEL_DIR:?set the verified ShieldGemma directory}
        target: /models/shieldgemma
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${QWEN_MODEL_DIR:?set the verified Qwen directory}
        target: /models/qwen35-9b
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /srv/appdata/karakeep/secrets/local-token
        target: /run/secrets/shield_token
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /srv/appdata/karakeep/secrets/catalog-token
        target: /run/secrets/catalog_token
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /srv/appdata/karakeep/gpu-lease
        target: /gpu-lease
        bind: { create_host_path: false }
    networks: [media-local]
networks:
  media-local:
    external: true
    name: ${MEDIA_LOCAL_NETWORK:-karakeep_media-local}
